version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: src/EnterpriseKnowledgeAssistant.Api/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Use a local Postgres instance instead of a dockerized one.
      # When running the API container, use host.docker.internal to reach the host's Postgres on Windows/macOS.
      # If you run the API directly on the host (not in a container) use 'localhost' in your connection string.
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=eka_db;Username=eka_user;Password=eka_pass;Pooling=true;Timeout=15;
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka123
      POSTGRES_DB: eka
    ports:
      - "5432:5432"
